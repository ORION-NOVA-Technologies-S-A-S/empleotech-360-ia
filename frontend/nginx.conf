server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # ORI SECURITY: cabeceras de seguridad
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self), xr-spatial-tracking=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://aframe.io https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src blob: https://cdn.jsdelivr.net; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location / {
    try_files $uri /index.html;
  }
}
